services:

  app:
    build: "."
    image: "app.bigsexypoems.com/build-main:latest"
    pull_policy: "never"
    command: [ "npm", "run", "build" ]
    volumes:
      - "./:/app"
      # Mount the ColdFusion app so that the build can access the JS/LESS files that we've
      # collocated with the CFML views. Note that mapped folders MUST be under the project
      # root, "/app/". Parcel resolves root-absolute imports (ex, "/client") relative to
      # the project root ("/app"), not to the server root ("/").
      - "../../client:/app/client"
      # Save dist files into static CFML volume where they can be consumed by the app.
      - "../../wwwroot/static:/app/static"
      # Allow docker to manage the node modules.
      - "app_node_modules:/app/node_modules"

  # Provides a "watch" execution for the light-weight build above.
  dev:
    extends: "app"
    profiles:
      - "dev"
    command: [ "npm", "run", "watch" ]

# Using docker volumes to manage node_modules ensures that we don't overwrite the
# node_modules folder when we mount our source code. It also helps performance.
volumes:
  app_node_modules:
